# --- pinned rule parameters (mirror of config/rules.yaml; the self-check test
#     fails if the committed config drifts from this table) ---
rule_params:
  R1: { p: 0.80, delta_minutes: 60, min_amount_minor: 10000 }
  R2: { k: 8, window_hours: 24, tau_source: corpus_percentile, tau_percentile: 25 }
  R3: { k: 8, window_hours: 24 }
  R4: { retention: 0.6, min_length: 3, max_length: 6, require_strict_time_increase: true,
        down_weight_periodic: true, periodic_period_hours: 168, periodic_down_weight: 0.3 }
  R5: { n: 3, window_days: 7, threshold_band_low: 0.80, threshold_band_high: 1.00, synthetic: true }
  R6: { z: 3.0, baseline_days: 30, min_baseline_days: 5, robust_scale: mad }
  R7: { dormant_days: 30, k: 5, window_hours: 24 }
  R8: { q: 0.40, min_transactions: 10, quiet_hours_source: account_decile }
  R9: { m: 4, recent_days: 7, baseline_days: 30 }
  R10: { s: 0.70, holding_hours: 6 }
  R11: { g: 0.80, c: 6, window_hours: 48 }
  R12: { min_length: 3, delta_hours: 24, decay: 0.95, require_non_increasing: true }

# --- fixture-level synthetic assumptions (see DEVIATIONS block at bottom) ---
assumptions:
  structuring_threshold_minor: 2_500_000   # T for R5; band 2_000_000..2_500_000
  tau_expectation_minor: 22_000            # corpus p25 of amount_minor (EUR-only identical)
  tau_design_bracket: "2*4125 < tau < 240000/2, i.e. 8250 < tau < 120000"
  reversal_encoding: "txn_type == REVERSAL marks a reversal (guards.exclude_reversals_from)"
  dormant_gap_reading: >
    R7 dormancy is calendar days between last activity and next activity
    (Jan 5 -> Feb 9 = 35 days by date subtraction; 34 fully empty days).
    The 29d near-miss (Jan 5 -> Feb 3) fails under BOTH readings (28 full /
    29 by subtraction), so the expectation is interpretation-proof.
  odd_hour_quiet_set: >
    quiet hours = the account's own lowest-volume hours (config
    quiet_hours_source: account_decile). Every planted night-hour txn sits in
    an hour with ZERO baseline volume, so ANY decile rule (2.4h strict, or
    every zero-volume hour) puts them in the quiet set; every must-not-fire
    variant is below q under either reading.

conventions:
  r5_direction: >
    R5 is evaluated on transactions ORIGINATED by the account. Under a
    direction-blind count the shared ACC-AGENT-S1 (receives the whole ladder)
    would also appear - the self-check tolerates either reading for AGENT-S1
    only; every other R5 statement is direction-independent.
  r6_baseline: >
    z = (max daily count - median of active-day daily counts) /
    (1.4826 * MAD of active-day daily counts). "Daily txn count" is the
    account's own activity in any direction, matching the committed
    txn_count_in_24h feature (features.yaml), so a one-counterparty burst
    scores identically on both sides of the pair. Active-day count <
    min_baseline_days -> never evaluated. MAD == 0 -> not significant (no
    hit). Near-misses are additionally proven below z=3 under the unscaled
    raw-MAD convention where that changes the verdict (S38).
  r11_counting: >
    count = distinct counterparties whose FIRST pair-transaction with the
    account falls inside W=48h is the fresh numerator; denominator = distinct
    counterparties ACTIVE in W. All must-not-fire R11 accounts fail under
    every alternative reading except the four hubs declared as intended
    R11 positives/collateral hits.
  r12_gate: >
    min_length 3 = at least 3 hops; gate is non-increasing amounts
    (require_non_increasing); decay enters severity only. S28 fires under a
    decay-gate reading too (every hop is exactly x0.95), so the planted
    positive is interpretation-proof.
  zero_and_reversal: >
    zero-value rows excluded from value rules (guards); reversals excluded
    from R4/R12/R1 (guards).

