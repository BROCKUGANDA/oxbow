# definitions and defaults in plan SS9 / config/rules.yaml, BEFORE any rule
# code exists. 00 SB: "a fixture whose expected value came from the code it
# tests proves nothing." Row ordinals below are the integer part of the
# namespaced txn_id (golden:000057 -> 57).
#
# Loader: tests/golden/loader.py. Regenerate the rows:
#   uv run python tests/golden/build_fixture.py   (seed 1337, byte-stable)

