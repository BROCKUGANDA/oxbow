# STRUCTURAL INVENTORY (self-check asserts these against the built rows)
# ===========================================================================
structural_inventory:
  usd_rows: [101, 102]
  self_transfer_rows: [378]
  zero_amount_rows: [413, 415]
  reversal_rows: [387, 392]
  balance_inconsistent_rows: [290, 292, 295]
  external_only_accounts: [ACC-EXT-001, ACC-EXT-002]   # appear as account_to only
  singleton_accounts: [ACC-LONER, ACC-EXT-002]
  supernode_accounts: [ACC-RAIL-AGENT]                 # total_degree 48, max
  second_high_degree: [ACC-BURST-A, ACC-BURST-B]       # 44 each (harmless: no expectations)
  in_band_r5_rows_outside_smurf: []                    # noise clamp guarantees empty
  fraud_labelled_rows_are_planted_only: true           # label_is_fraud=1 iff row is in a planted positive scenario

# ===========================================================================
# DEVIATIONS: what plan SS9 pins that config/rules.yaml does NOT carry
# ===========================================================================
deviations:
  - id: DEV-G1
    summary: "R5 threshold T has no configured value"
    detail: >
      plan SS9: "T from histogram mode"; config carries threshold_source:
      histogram_mode plus a synthetic flag but NO numeric T and no
      golden-corpus override. This fixture pins T = 2_500_000 minor as an
      assumption (assumptions.structuring_threshold_minor). The rules engine
      must either accept the fixture-provided T or derive it from the
      amount histogram - the ladder is the only cluster in [2000000, 2500000]
      (noise is clamped below 1500000, near-miss outlier 1975000 sits just
      under the band), so histogram-mode detection lands on the same value.
  - id: DEV-G2
    summary: "R2 tau has no golden override"
    detail: >
      tau_source corpus_percentile is computed at run time. Hand-derived
      bracket: 8250 < tau < 120000 (measured p25 = 22000; the self-check
      recomputes p25 and re-asserts the bracket). If a future fixture edit
      moves noise volume across the clamp, this bracket is the guard.
  - id: DEV-G3
    summary: "rail degree percentile lives in config/pipeline.yaml, not rules.yaml"
    detail: "graph.rail_degree_percentile: 99.0 (config/pipeline.yaml) + the P3a nearest-rank formula. rules.yaml R2/R3 exclude_node_types [rail, external] but never say how a rail is recognised; noted, not edited."
  - id: DEV-G4
    summary: "R11 has no rail/external exclusion"
    detail: >
      R2/R3 carry exclude_node_types; R11 does not. ACC-RAIL-AGENT is built
      so R11 fails on its own arithmetic (share 0.40), so the expectations
      hold either way - but a future rail with many fresh counterparties
      would fire R11 by config. Flagged for the rules agent; config not
      touched.
  - id: DEV-G5
    summary: "golden txn_type REVERSAL extends PAYSIM_TXN_TYPES"
    detail: "raw_paysim.py restricts type to five values; that is the PaySim CONTRACT. source_dataset=golden is its own corpus with a six-value alphabet (README). The loader keeps REVERSAL legal."
