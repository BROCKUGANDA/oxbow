<!-- OXBOW glyph: embargo - the walk-forward embargo gap.
     Two blocks separated by a hatched gap. Used by the validation page and the
     walk-forward diagram, where the gap between train and test is the finding.
     Spec 12.6 glyph system: 24x24 grid, 1.75px stroke, square line caps, 2px optical padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="round">
  <path d="M2.5 6.5H8.5V17.5H2.5ZM15.5 6.5H21.5V17.5H15.5Z"/>
  <!-- 45-degree hatch at 1.7px perpendicular spacing, held clear of both block strokes -->
  <path d="M9.6 15.9L13.9 11.6M9.6 13.5L13.9 9.2M10.6 17.5L13.9 14.2"/>
</svg>
