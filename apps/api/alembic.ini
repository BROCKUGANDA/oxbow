# Alembic configuration for the OXBOW warehouse schema (plan §13, task item 10).
#
# `make db-migrate` runs `alembic -c apps/api/alembic.ini upgrade head`, so this
# file is the only place the migration path is configured. The database URL comes
# from the environment and never from here: a committed URL is either a lie about
# a local port or a credential (02 §F: secrets from the environment, .env never
# committed).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../..
version_path_separator = os
# Trailing newline conventions are pinned so a generated migration does not arrive
# with the line endings of whichever machine autogenerated it.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

# --- logging ---------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
