# OXBOW - local stack.
# Spec 12.9: `docker compose up` IS the reproducibility claim.
# 02 F supply chain: containers built from PINNED DIGESTS, secrets from the
# environment, .env.example committed and .env never.
#
# 03 J: a required dependency down at startup must produce DEGRADED MODE with the
# dashboard naming what is unavailable, not a failed boot. Every service here has
# a healthcheck so the app can decide what it can still do.

name: oxbow

x-restart: &restart
  restart: unless-stopped

# Supply-chain pinning (02 §F, plan T4): every image below is pinned by digest as
# well as tag, and `make lint` rejects any `image:` line that is not. The digests were
# resolved from the registries on 2026-09-26 with `docker buildx imagetools inspect`,
# which reads the manifest index without a running engine.
#
# Two MinIO images are the recorded exception, because they cannot be resolved
# anonymously and I will not invent a digest: quay.io issues a token for
# `repository:minio/minio:pull` whose claims grant `actions: []`, so the manifest
# fetch answers 401 for an unauthenticated caller. That is server-side authorization,
# not a client header problem -- the same flow resolves docker.io and ghcr.io freely.
# The tag here is the published MinIO release tag, so it is reproducible but not
# integrity-pinned; pin it with credentials via the TODO marker below.
# TODO(supply-chain): pin minio/minio and minio/mc digests with a Quay credential.

services:
  postgres:
    # Postgres 16 (01 D). JSONB for evidence bundles, array columns for evidence
    # ids, real indexes.
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxbow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxbow_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-oxbow}
      # Deterministic collation, so ORDER BY does not depend on host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # Host port 5433 by default, not 5432. Measured on this host: a native
    # postgres.exe is bound to 0.0.0.0:5432 alongside the Docker proxy, so a host
    # connection to 5432 answers from that server and reports
    # `FATAL: role "oxbow" does not exist`. The container is healthy either way,
    # which is the worst kind of failure: it looks like a bad password.
    # Override with POSTGRES_PORT if the host port is free.
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxbow} -d ${POSTGRES_DB:-oxbow}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    command:
      # Money is integer minor units (01 B hard constraint), so numeric is only
      # used for the probability columns, never for amounts.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    <<: *restart
    # RQ: pipeline runs and policy simulations as jobs with live progress. Far
    # less ceremony than Celery.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO moved off Docker Hub; the Docker Hub path now returns
    # "pull access denied for minio/minio". The quay.io path is the live one.
    # This exact tag was smoke-tested on this host before being pinned.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    <<: *restart
    # Object storage, both directions. Real, not a stub: 02 C lists this as the
    # one genuinely integrated external system in the demo.
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-oxbow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-oxbow_local_only}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    # Verified local tag; the Docker Hub minio/mc path is deprecated.
    image: minio/mc:RELEASE.2024-08-13T05-33-17Z
    <<: *restart
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER:-oxbow} ${MINIO_PASSWORD:-oxbow_local_only} &&
      mc mb --ignore-existing local/oxbow &&
      mc mb --ignore-existing local/oxbow-packets &&
      echo 'buckets ready'
      "
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0@sha256:e68e3089108faf453681319dc7ae6e746b6f25c28243167dcead391c051871ae
    <<: *restart
    # Experiment and model registry. Real, in Compose. This is where the
    # "test fold touched once" timestamp lives.
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    <<: *restart
    # Identity provider (02 C). OIDC authorization code with PKCE. DEV MODE ONLY:
    # this is a research prototype, not an identity product. The local JWT
    # fallback keeps the offline demo working with this stopped.
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./apps/api/keycloak/realm-oxbow.json:/opt/keycloak/data/import/realm-oxbow.json:ro
    ports: ["${KEYCLOAK_PORT:-8081}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  echo:
    build:
      # Repository root, not apps/api: echo.py imports the signature scheme from
      # packages/pipeline/oxbow/adapters/signing.py, which must be in the build
      # context. Same convention as the `api` and `worker` services below.
      context: .
      dockerfile: apps/api/Dockerfile.echo
    <<: *restart
    # 02 H: a tiny FastAPI echo service that verifies the signature and records
    # deliveries. Signing, retries, idempotency and dead-lettering are exercised
    # end to end against THIS, not against a mock in a test file.
    environment:
      SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-oxbow_local_secret}
      RECORD_PATH: /data/deliveries.jsonl
    ports: ["${ECHO_PORT:-8099}:8099"]
    volumes:
      - echo_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8099/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- application services (profile-gated: the demo boots offline) ------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: *restart
    profiles: ["full"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oxbow}:${POSTGRES_PASSWORD:-oxbow_local_only}@postgres:5432/${POSTGRES_DB:-oxbow}
      REDIS_URL: redis://redis:6379/0
      RUN_SALT: ${RUN_SALT:?RUN_SALT is required and must come from the environment, never the repo}
      OXBOW_SEED: ${OXBOW_SEED:-1337}
    ports: ["8000:8000"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: *restart
    profiles: ["full"]
    command: ["python", "apps/api/worker.py"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oxbow}:${POSTGRES_PASSWORD:-oxbow_local_only}@postgres:5432/${POSTGRES_DB:-oxbow}
      REDIS_URL: redis://redis:6379/0
      RUN_SALT: ${RUN_SALT:?RUN_SALT is required}
      OXBOW_SEED: ${OXBOW_SEED:-1337}

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    <<: *restart
    profiles: ["full"]
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mlflow_data:
  echo_data:
