# OXBOW declared data sources.
# 01 B hard constraint: historical, public or de-identified data ONLY. Ingest
# REFUSES any source not declared here, and every declared source carries a
# license and a citation.
#
# Owner: P1a (ingest).
#
# This file is the allowlist. A source that is not in it cannot be read by the
# pipeline, which is how the track rule is enforced mechanically rather than by
# good intentions.

schema_version: 1

# --- primary: mobile-money shape ----------------------------------------
sources:
  - id: paysim
    name: "PaySim1"
    role: primary
    module: "tabular risk scoring + topology"
    source_url: "https://www.kaggle.com/datasets/ealaxi/paysim1"
    retrieval: "scripts/download_data.py"
    files:
      - name: "PS_20174392719_1491204439457_log.csv"
        # Verified on retrieval: the archive really does contain this member. The
        # filename carries the simulator's run timestamp, so it is not the
        # tidy "PS_2014_01.csv" one might assume. P0 declared that guess and the
        # downloader failed closed on it, which is the behaviour we want.
        # SHA-256 of the extracted bytes, recorded 2026-09-26 from the file the
        # pipeline actually reads (not the archive). Verified at download and
        # re-verified by `make data`. A mismatch fails closed; it never proceeds
        # with the wrong bytes.
        #
        # 493,534,783 bytes, 6,362,620 data rows (+1 header line).
        sha256: "16910f90577b0d981bf8ff289714510bb89bc71bff7d3f220f024e287e4eea6b"
    license: "CC BY-SA 4.0"
    license_obligation: >-
      Share-alike. Any derivative dataset we publish, including the canonical
      event table and any feature extract, inherits CC BY-SA 4.0 and must be
      released under the same terms with attribution.
    citation: >-
      E. A. Lopez-Rojas, A. Elmir, S. Axelsson, "PaySim: A financial mobile money
      simulator for fraud detection," 28th European Modeling and Simulation
      Symposium (EMSS), Larnaca, Cyprus, 2016.
    description: >-
      Agent-based simulator calibrated on one month of real logs from an African
      mobile-money operator. CASH-IN, CASH-OUT, DEBIT, PAYMENT, TRANSFER. Roughly
      6.3M rows. Sender and receiver ids give a real graph; balance columns give
      an exposure proxy.
    label_caveat: >-
      isFraud covers a NARROW behaviour: an agent takes over an account and
      drains it via TRANSFER then CASH-OUT. isFlaggedFraud is a crude threshold,
      not ground truth. This must be stated before a judge finds it.
    synthetic_fields: [step, oldBalanceOrig, newBalanceOrig, oldBalanceDest, newBalanceDest]
    known_biases:
      - "Simulated, not observed transactions; absolute amounts are not real."
      - "Fraud prevalence is a simulator parameter, not a measured rate."
      - "Balance columns are known to be internally inconsistent with amount."

  # --- primary for Module B: AML typologies --------------------------------
  - id: ibmaml
    name: "IBM Transactions for Anti-Money Laundering"
    role: primary
    module: "network typology detection (Module B)"
    # NOTE: the slug ends in "-aml". P0 declared the slug without that suffix
    # and Kaggle answered 403 "Permission 'datasets.get' was denied", which
    # reads like a credentials problem and is actually a wrong slug.
    # The size first recorded here, 41.6 GB, was read off the dataset listing and
    # is wrong for our purposes: DEV-013 measured the bundle actually served at
    # 8.18 GB, of which the HI-Small scenario we ingest is ~510 MB.
    source_url: "https://www.kaggle.com/datasets/ealtman2019/ibm-transactions-for-anti-money-laundering-aml"
    retrieval: "scripts/download_data.py"
    # ACQUISITION SCOPE: the dataset ships six bundles — HI and LI (high/low injection)
    # crossed with Small, Medium and Large. ONLY HI-Small is acquired here; the other
    # five are not on this host and are not hashed, so every count quoted from this
    # source describes HI-Small alone and must be labelled as such wherever it appears.
    # --- MEASURED AGAINST REAL BYTES, 2026-09-26, and it contradicts this block ----
    # The archive this slug serves is the 2023 revision of the corpus (citation:
    # arXiv 2306.16424). Its transaction file is HI-Small_Trans.csv, NOT
    # transactions.csv, and its header is 11 columns with `Account` appearing
    # TWICE (source account, destination account):
    #   Timestamp,From Bank,Account,To Bank,Account,Amount Received,
    #   Receiving Currency,Amount Paid,Payment Currency,Payment Format,Is Laundering
    # There is no stepFrom/stepTo, no balanceOrig/balanceDest, and no
    # isFlood/isDateSpam/isForcedCashout/unlabeled set. The typology taxonomy lives
    # in HI-Small_Patterns.txt instead, as labelled blocks of transaction rows
    # (CYCLE, FAN-OUT, GATHER-SCATTER, SCATTER-GATHER, BIPARTITE, STACK, RANDOM).
    # Measured over all 5,078,345 rows (DEV-013): laundering prevalence 0.1019%,
    # median account degree 10.0, 647,939 directed edges once self-loops are set
    # aside, and 591,212 rows (11.642%) that are self-edges — every one of the
    # 481,056 Payment Format = Reinvestment rows among them. Counts for the whole
    # file, not a sample: 15 currency NAMES rather than ISO-4217 codes ("US Dollar",
    # "Euro", "Swiss Franc", "Yuan", "Shekel", "Rupee", "UK Pound", "Ruble", "Yen",
    # "Bitcoin", "Canadian Dollar", "Australian Dollar", "Mexican Peso", "Saudi
    # Riyal", "Brazil Real"), 72,170 rows whose receiving and payment currencies
    # differ, 72,158 where the two amounts differ, 146,066 amounts with more than
    # two decimals (all Bitcoin, all six places), and 9 rows duplicated across all
    # eleven columns. The 50,000-row sample an earlier revision of this comment
    # quoted is a subset of the above and was provisional.
    # The two entries this block used to carry, transactions.csv and patterns.csv,
    # are member names of the *2019* revision of the corpus. This slug serves the
    # 2023 revision, where they do not exist; a hash slot for a file that is not
    # there can only be filled by a sentinel or a fabrication, so both are gone and
    # the three members below are the whole of what Module B reads.
    files:
      - name: "HI-Small_Trans.csv"
        # 475,664,283 bytes, 5,078,345 data rows plus one header line. Measured
        # 2026-09-26 from the file the pipeline would read.
        sha256: "b19d39f515523373f991b689c07e11e7b0b95c17a2c27a87d91584ae16c5b040"
      - name: "HI-Small_accounts.csv"
        # 34,053,187 bytes. Header: Bank Name,Bank ID,Account Number,Entity ID,
        # Entity Name. This is what makes an account identity a (bank, account)
        # PAIR: the same account number recurs across banks, so hashing the account
        # string alone would merge distinct accounts into one node.
        sha256: "786808526e33cfc441212dd6fccda7edfc24172149bed59c6ef59b186836b014"
      - name: "HI-Small_Patterns.txt"
        # 323,844 bytes, 4,319 lines, 740 block headers over 370 labelled attempts.
        # Not CSV: BEGIN/END "LAUNDERING ATTEMPT - <TYPOLOGY>" blocks wrapping
        # transaction rows, so typology membership is recovered by matching rows
        # back to their block.
        sha256: "2c546b5ce6009e73851f0139af053cf845f08bf92f3bc82fe1eb937dec2ef39b"
    license: "CDLA-Sharing-1.0"
    # --- WHAT ACTUALLY SITS ON DISK ----------------------------------------
    # The corpus ships six scenario bundles: HI/LI (high intensity / low
    # intensity) crossed with Small / Medium / Large. Only HI-Small was acquired:
    # it is the bundle carrying the labelled typology blocks, and the other five
    # would take the acquisition from ~510 MB to the full ~8.18 GB (DEV-013) for
    # no additional typology ground truth. Every Module B number in this
    # repository -- median degree 10.0, the DEV-015 cycle table, the DEV-014
    # typology counts -- is measured over HI-Small alone and must be quoted that
    # way. A reviewer who reads "IBM-AML has 5.08M rows" without the scope
    # attached will overstate the evidence behind the network claim.
    acquisition_scope: >-
      Six bundles exist (HI/LI x Small/Medium/Large); only HI-Small was acquired,
      ~510 MB of the ~8.18 GB served by the slug.
    license_obligation: >-
      Share-alike on derived data. Any derivative dataset we publish inherits
      CDLA-Sharing-1.0. The repository code is Apache-2.0, but the DATA carries
      the stricter CDLA terms.
    citation: >-
      ealtman2019, IBM Transactions for Anti-Money Laundering, Kaggle.
    description: >-
      Ships laundering labels AND a typology/pattern file: fan-in, fan-out,
      cycles, stacks, gather-scatter. This is the corpus that proves network
      detection, because it carries explicit typology labels.
    label_caveat: >-
      Is Laundering is a curated research annotation, not a prosecuted case, and it
      is the corpus's ONLY label column: 5,177 of 5,078,345 rows. Typology
      membership is not a label at all — it comes from the annotated attempt blocks
      in HI-Small_Patterns.txt, which cover just 3,209 of those 5,177 positives, so
      1,968 laundering rows carry no typology and a row with no typology is
      unlabeled rather than clean. No threshold-flag concept exists here, so
      label_is_flagged is 0 with the meaning "no equivalent", never "checked and
      cleared".
    known_biases:
      - "Synthetic injection over a simulated base; the injected patterns are designed, not observed."
      - "11.642% of rows are self-transfers. They are carried by ingest and excluded at the graph layer, not treated as errors."
      - "Minute-precision timestamps with no declared zone: instants are read in the zone named by config/pipeline.yaml ibmaml.source_timezone_assumption, which is an assumption."
      - "Amount Paid and Amount Received differ on 72,158 rows; canonical v1 has one amount slot, so the spread is dropped."
      - "Typology labels are not balanced across categories (716 GATHER-SCATTER down to 191 RANDOM)."

  # --- cite only, NEVER ingested -----------------------------------------
  - id: elliptic
    name: "Elliptic Bitcoin Dataset"
    role: cite_only
    ingest_allowed: false
    source_url: "https://www.kaggle.com/datasets/elliptic/elliptic-data-transaction"
    license: "CC BY-NC-ND 4.0"
    license_obligation: >-
      NON-COMMERCIAL and NO DERIVATIVES. A derived sample would violate the
