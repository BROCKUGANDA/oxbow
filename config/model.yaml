# OXBOW model configuration.
# Spec 5.3 tier table. The LightGBM is the ranking engine; the scorecard is the
# auditable reference; IsolationForest keeps the product honest about label
# scarcity; fusion stays explainable because its coefficients are printable.
#
# Owner: P4b (models, calibration, fusion, SHAP).

seed: 1337

# --- baseline 0: rules-only severity sum ---------------------------------
# Proves the ML earns its place. Must be beaten on PR-AUC and precision at
# budget, or the complexity is not justified.
baselines:
  rules_only:
    enabled: true
    score: sum_of_rule_severity
  scorecard_only:
    enabled: true
    note: "The scorecard itself, doubling as the transparent reference"

# --- primary: LightGBM ---------------------------------------------------
gbm:
  library: lightgbm
  objective: binary
  # deterministic=true is what makes two runs produce identical models.
  deterministic: true
  force_row_wise: true
  # From the train prior, never hand-set.
  scale_pos_weight: from_train_prior
  early_stopping_rounds: 100
  eval_metric: average_precision     # PR-AUC is the headline under imbalance
  n_estimators: 2000
  params:
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    max_bin: 255

# --- tuning --------------------------------------------------------------
optuna:
  n_trials: 40
  sampler: tpe
  seed: 1337
  # Every trial logged. The number of configurations evaluated is itself a
  # reported number: with N configurations tried, the best validation result is
  # optimistically biased, which is exactly why the reported headline comes from
  # the untouched test fold.
  log_every_trial: true
  study_name: oxbow-gbm
  # Selection happens on VALIDATION. The test fold is touched once, and that
  # fact is timestamped in the MLflow run.
  direction: maximize
  search_space:
    learning_rate: { type: float, low: 0.01, high: 0.2, log: true }
    num_leaves: { type: int, low: 15, high: 127 }
    min_child_samples: { type: int, low: 10, high: 200 }
    colsample_bytree: { type: float, low: 0.5, high: 1.0 }
    reg_alpha: { type: float, low: 1e-8, high: 10.0, log: true }
    reg_lambda: { type: float, low: 1e-8, high: 10.0, log: true }

# --- unsupervised: Isolation Forest --------------------------------------
# Unusual-but-unlabelled behaviour. Keeps the product honest about label
# scarcity: real financial crime is under-reported, so a purely supervised
# model only learns what a labeller already found.
anomaly:
  library: sklearn
  model: IsolationForest
  n_estimators: 300
  contamination: "auto"
  max_samples: "auto"
  random_state: 1337
  # Score normalised to 0-1 by VALIDATION percentile rank, never by a min-max
  # fitted on the same data it is scored on.
  normalisation: validation_percentile_rank

# --- fusion (spec 5.3) ---------------------------------------------------
# No hand-tuned weights. A constrained, non-negative logistic meta-learner over
# these inputs, fitted on VALIDATION. The coefficients are printable, so the
# fused score is still explicable in one line.
fusion:
  method: constrained_logistic
  fitted_on: validation
  non_negative: true
  inputs:
    - p_scorecard
    - p_gbm
    - anomaly_norm
    - rule_severity_max
    - rule_hit_count
    - cycle_flag
    - fan_flag
  regularisation_strength: 1.0
  # Coefficients rendered on the validation page: the fused score in one line.
  show_coefficients: true

# --- calibration (spec 5.3) ----------------------------------------------
# Calibration is LOAD-BEARING here: Module C multiplies these probabilities by
# money, so a miscalibrated model produces wrong currency figures.
calibration:
  method: isotonic
  # Isotonic falls back to Platt below roughly 500 validation positives.
  isotonic_min_positives: 500
  fallback_method: platt
  # Below the floor, calibration is REFUSED and the UI says probabilities are
  # uncalibrated rather than showing a number it cannot stand behind.
  below_floor_action: refuse_and_label_uncalibrated
  # If positives are oversampled, either correct the intercept (King and Zeng) or
  # calibrate on a base-rate-preserving holdout. Say which, in the model card.
  oversampling_correction: king_zeng_intercept
  base_rate_preserving_holdout: true
  report: [brier_score, reliability_diagram, ece]

# --- explainability ------------------------------------------------------
shap:
  explainer: TreeExplainer
  # Precomputed and persisted per scored row during the run. The API only reads;
  # it never computes SHAP at request time, because that stalls the browser.
  precompute: true
  persist_per_row: true
  # A degenerate tree yields an empty explanation. Fall back to the scorecard
  # points contribution and label the case scorecard-explained.
  on_degenerate_tree: fallback_to_points

# --- drift guard ---------------------------------------------------------
drift:
  psi_watch: 0.10
  psi_action: 0.25
  on_action: degrade_to_rules_plus_scorecard
  # A feature or model version skew means scoring with a feature set the model
  # never saw, producing confident nonsense. Mismatch refuses to score.
  enforce_feature_hash_match: true

# --- tracking ------------------------------------------------------------
mlflow:
  tracking_uri: "http://localhost:5000"
  experiment: oxbow
  log_models: true
  log_shap: true
  log_fold_touch_timestamps: true
