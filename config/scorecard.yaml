# OXBOW scorecard specification.
# Spec 4: the scorecard is the score a human can audit, argue with, and sign off.
# The GBM is the ranking engine. Both ship, both report, and the disagreement
# queue between them is shown, because that is where model risk actually lives.
#
# Owner: P4a (scorecard). Filled for real in P4a: every key below is read by
# packages/pipeline/oxbow/scoring/config.py, which fails loud on a missing or
# mistyped key rather than defaulting it.

# --- scaling constants ---------------------------------------------------
# score = offset + factor * ln(odds), with odds = P(good) / P(bad).
# factor = PDO / ln(2)
# offset = base_score - factor * ln(base_odds)
# A judge must be able to add the points column up by hand and land on the score.
scaling:
  pdo: 20                  # points to double the odds
  base_score: 600
  base_odds: 50            # 50:1
  # Derived, recorded so the UI can show the arithmetic. P0's committed comment
  # stated offset = 472.4184; that is arithmetically wrong for these constants
  # (it implies ln(base_odds) = 4.42, i.e. base_odds ~ 83). The formula above is
  # the authority (plan §10) and the code derives both numbers, so the comment is
  # corrected rather than the formula reinterpreted:
  #   factor = 20 / ln(2)          = 28.8539008178
  #   offset = 600 - factor*ln(50) = 487.1267934497
  #   score(at 50:1)               = 600.0000000000  <- the named gate clause
  show_formula_in_ui: true

# --- binning (spec 4.2) --------------------------------------------------
binning:
  algorithm: monotonic_optimal     # optbinning; split points only, the bin table is ours
  min_bin_pct: 0.05                # at least 5% of the population per bin
  max_bins: 8
  enforce_monotonic_trend: true    # optbinning monotonic_trend="auto_asc_desc"
  solver: mip                      # optbinning solver: mip | cp | ls
  prebinning_method: quantile      # candidate boundaries before the optimum is solved
  max_n_prebins: 100               # measured on this host: 100 candidates solve in ~0.1 s
  min_prebin_size: 0.05            # per feature §10's 5% rule is re-enforced by the merge
                                   # pass afterwards; this bounds the candidate count so
                                   # the solver stays inside the 90-second stage budget
  split_digits: 4                  # boundary precision written into the artefact
  time_limit_seconds: 20.0         # per feature; the quantile fallback fires past it
  # Special bins, because a missing value is evidence and a structural zero is
  # not the same thing as a small number.
  special_bins:
    missing: "__missing__"
    structural_zero: "__zero__"
  # A bin with zero bads gives infinite WOE and makes the points table nonsense.
  # Minimum count plus Laplace smoothing; bins below the floor merge with the
  # neighbour and the merge is recorded (03 H: test_no_infinite_woe).
  min_bin_count: 30
  smoothing: laplace
  laplace_alpha: 0.5
  floor_merge_preference: smaller_neighbour  # the merge disturbs the least informative bin
  # A category unseen at scoring time gets its own bin fitted from the training
  # tail, rather than being silently mapped to the most common category
  # (03 H: test_unseen_category_handled). The tail is the rarest populated value
  # bin and the artefact names it.
  unseen_category_bin: "__unseen__"
  unseen_tail_population_share: 0.10
  # Features read as categories. The registry (P2) declares dtypes and a
  # `categories` list, so this list must name published entries whose values are
  # nominal; a name listed and not published is a build error, not a silent numeric.
  # local_hour_code and txn_type_code carry declared `categories` in features.yaml:
  # hour 23 is not "greater than" hour 1 in any monotone-trend sense, and handing the
  # scorecard an integer code would let it learn the coding's ordering as a trend.
  # graph_community_id is a Leiden identifier with no ordering either, so it is
  # categorical here even though the registry types it int64.
  categorical_features:
    - local_hour_code
    - txn_type_code
    - graph_community_id

# --- feature admission ---------------------------------------------------
# IV = sum_b (g_b/G - b_b/B) * WOE_b, WOE_b = ln((g_b/G)/(b_b/B))
# Feature admission rule: keep 0.02 <= IV <= 0.5. Anything above 0.5 is treated
# as SUSPECTED LEAKAGE and must be justified in writing before it enters the
# scorecard. Make that rule visible on the page, because self-imposed constraints
# read as rigor.
iv_bounds:
  min: 0.02
  max: 0.5
  above_max_action: require_written_justification
  below_min_action: exclude_and_record
  show_rule_in_ui: true
  # The refusals are fields of the emitted model artefact, not just a policy in
  # this file: a reader sees which features were refused and on what grounds.
  record_refusals_in_artifact: true

# --- fitting -------------------------------------------------------------
fit:
  # Regularisation on by default. Perfect separation diverges the coefficients
  # and makes the scorecard unusable; a separation check fails loudly and names
  # the feature (03 H: test_separation_detected).
  regularisation: l2
  regularisation_strength: 1.0
  solver: lbfgs
  tolerance: 1.0e-8
  detect_separation: true
  separation_auc_threshold: 1.0    # exact: a column that ranks every bad above every good
  separation_action: fail_named    # fail_named | exclude_and_record
  # A converged-but-diverging coefficient is quasi-complete separation wearing a
  # regularisation hat; 6.0 on WOE-scaled inputs is already implausible.
  max_abs_coefficient: 6.0
  max_iter: 500
  # Points are whole numbers so a judge can add the column by hand.
  round_points_to_integer: true
  # features.yaml's leakage guard, re-checked at this boundary: P2 owns the feature
  # table, which does not make P4 innocent of training on a leak.
  max_abs_correlation_with_label: 0.98

# --- bands (spec 4.4) ----------------------------------------------------
# Cut by OBSERVED bad rate on validation, never by a round number. Each band
# carries population share, observed rate, and the action it implies.
#
# DIRECTION (DEV-012, decided in P4a): points rise as risk FALLS. That is forced by
# plan §10's own reason-code example -- a top-decile pass-through ratio reads as
# "minus 48 points" -- and by the PDO formula, where 600 is the score at 50:1
# good:bad odds. So band A (safest, monitor) sits at the TOP of the points scale and
# band E (riskiest, escalate) at the bottom. P0's placeholder numbers implied the
# opposite direction; the plan's formula and example outrank a placeholder (rank 2
# over a comment), and the boundaries below are fitted, so no placeholder survives.
bands:
  direction: higher_points_are_safer
  fit_on: validation
  # Isotonic smoothing before cutting: a sparse score would otherwise read as a 100%
  # bad rate and drag a boundary across the whole population.
  isotonic_smooth: true
  entries:
    - { id: A, label: "A", action: monitor,   glyph: band-meter, bad_rate_multiple_of_base: 0.25, min_points: null, max_points: null }
    - { id: B, label: "B", action: review,    glyph: band-meter, bad_rate_multiple_of_base: 0.75, min_points: null, max_points: null }
    - { id: C, label: "C", action: review,    glyph: band-meter, bad_rate_multiple_of_base: 1.5,  min_points: null, max_points: null }
    - { id: D, label: "D", action: escalate,  glyph: band-meter, bad_rate_multiple_of_base: 4.0,  min_points: null, max_points: null }
    - { id: E, label: "E", action: escalate,  glyph: band-meter, bad_rate_multiple_of_base: null, min_points: null, max_points: null }
# Boundaries are fitted on observed validation bad rate and then PINNED here so the
# band table is stable across runs. They are fitted values, so they are only
# defensible once the real feature table exists: pinning boundaries measured on the
# deterministic generated frame would put a fabricated number into committed config.
# `oxbow eval` writes them back from the real corpus and a human reviews the diff;
# the fitted table ships in the model artefact with its provenance label meanwhile.
band_cut_points: null   # pending the real feature table (P2 output / P6 measurement)

# --- reason codes --------------------------------------------------------
# The three largest negative point contributions, rendered as attribute plus bin,
# e.g. "Pass-through ratio in top decile: minus 48 points". Adverse-action style,
# deterministic, no model needed to write them.
reason_codes:
  top_n: 3
  template: "{attribute} in {bin_label}: {points_signed} points"
  points_signed_format: "{points:+d}"
  # plan §10 spells the sign out ("minus 48 points"); the signed integer stays
  # available to the UI through points_signed_format above.
  negative_word_form: true
  # Negative points are adverse. Anything else would make the reason list a list of
  # compliments about the account.
  sign_convention: negative_points_are_adverse
  bin_label_source: points_table

# --- drift (spec 4.4) ----------------------------------------------------
# PSI = sum_b (a_b - e_b) * ln(a_b / e_b)
# Standard thresholds, watch at 0.10 and action at 0.25.
drift:
  psi_watch: 0.10
  psi_action: 0.25
  # Characteristic Stability Index: the same formula on feature bins, to
  # localise any drift the PSI flags.
  csi_watch: 0.10
  csi_action: 0.25
  # At action the run degrades to rules-plus-scorecard and the banner says so
  # (03 H: test_psi_action_degrades_scoring). The rationale is asymmetric on
  # purpose: the GBM, the fusion and the calibration were all fitted on the
  # population that moved, while the scorecard is a table of whole numbers a human
  # signed off -- less accurate under drift, still defensible.
  on_action: degrade_to_rules_plus_scorecard
  expected_reference: fit_sample          # the fit distribution is the expected one
  period_column: fold                     # the walk-forward unit the splits module emits
  # Rating migration matrix period over period, with a downgrade-rate alert. A
  # standard risk artifact almost no hackathon project has.
  migration_matrix: true
  downgrade_rate_alert: 0.10
  # Score-level PSI bin count (the deciles of the fit score). Feature-level PSI uses
  # each feature's own fitted bins; re-binning on the scored period would hide the
  # very shift PSI exists to catch.
  score_psi_bins: 10

# --- determinism ---------------------------------------------------------
determinism:
  # Every sort in the codebase uses the (ts_utc, txn_id) tuple; exact score ties
  # at the cutoff are broken on (score, account_key) so queue order never changes
  # between runs (03 H: test_tie_break_deterministic).
  tie_break: [score, account_key]
  hash_algorithm: sha256         # matches config/pipeline.yaml determinism.hash_algorithm
