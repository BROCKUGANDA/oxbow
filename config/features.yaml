    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: never_null
    leakage_sensitive: false
    leakage_note: "reads local_hour, a field of the scored row, and never derives an hour from event_ts_utc"
  - id: overnight_count_30d
    group: temporal
    role: intermediate
    sentence: "How many of last month's transactions happened in the quiet hours."
    kind: window_agg
    agg: count
    source: row_unit
    where: is_overnight_hour
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count filtered on a row-local hour flag"
  - id: overnight_share_30d_bps
    group: temporal
    sentence: "What share of this account's recent activity happened while almost nobody was awake."
    kind: quotient_int
    numerator: overnight_count_30d
    denominator: txn_count_in_30d
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
