    formula: burstiness
    source: gap_since_previous_event_s
    where: has_prior_event
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: float64
    null_policy: null_when_indeterminate
    leakage_sensitive: true
    leakage_note: "ratio of two trailing statistics of backward gaps"
    declared_score_because: "(sigma - mu) / (sigma + mu) is dimensionless; it describes shape, not money"
  - id: active_days_30d
