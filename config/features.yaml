  # =======================================================================
  # balance proxy
  # =======================================================================
  # PaySim's balance columns are documented as inconsistent with `amount`
  # (contracts/raw_paysim.py). The disagreement is a FEATURE here, not a defect to
  # repair: reconciling it would delete the signal (plan §8, 03 D).
  - id: balance_delta_abs_minor
    group: balance_proxy
    role: intermediate
    sentence: "Working value: how far the stated balance change disagrees with the stated amount."
    kind: row_value
    value: balance_delta_abs_minor
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: int64
    null_policy: null_when_balance_absent
    leakage_sensitive: false
    leakage_note: "arithmetic on the scored row's own before and after balances"
  - id: has_balance_delta
    group: balance_proxy
    role: intermediate
    sentence: "Marks a transaction whose balances were reported at all."
    kind: row_flag
    predicate: has_balance_delta
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: never_null
    leakage_sensitive: false
    leakage_note: "a property of the scored row's own columns"
  - id: is_balance_delta_mismatch
    group: balance_proxy
    role: intermediate
    sentence: "Marks a transaction whose stated balances do not add up with the stated amount."
    kind: row_flag
    predicate: balance_delta_mismatch
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: null_when_balance_absent
    leakage_sensitive: false
    leakage_note: "a property of the scored row"
  - id: balance_mismatch_count_30d
    group: balance_proxy
    role: intermediate
    sentence: "How many times last month this account's own balances failed to add up."
    kind: window_agg
    agg: count
    source: row_unit
    where: is_balance_delta_mismatch
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count of a row-local flag"
  - id: balance_mismatch_share_30d_bps
    group: balance_proxy
    sentence: "What share of this account's recent transactions carry a balance that does not reconcile."
    kind: quotient_int
    numerator: balance_mismatch_count_30d
    denominator: txn_count_in_30d
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing counts"
  - id: balance_delta_total_30d_minor
    group: balance_proxy
    sentence: "How much of last month's stated balance movement failed to reconcile with the amounts, in minor units."
    kind: window_agg
    agg: sum
    source: balance_delta_abs_minor
    where: has_balance_delta
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    winsorise: true
    leakage_sensitive: true
    leakage_note: "maximum over a trailing window of row-local deltas"
  - id: balance_after_mean_30d_minor
    group: balance_proxy
    sentence: "The balance this account was left at on average after a transaction, in whole minor units."
    kind: window_agg
    agg: mean_int
    source: balance_after_minor
    where: has_balance
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_window_empty
    leakage_sensitive: true
    leakage_note: "median of the account's own stated balance over a trailing window"
  - id: is_zero_balance_after
    group: balance_proxy
    role: intermediate
    sentence: "Marks a transaction that left the account empty."
    kind: row_flag
    predicate: zero_balance_after
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: null_when_balance_absent
    leakage_sensitive: false
    leakage_note: "a property of the scored row"
  - id: drained_balance_count_30d
    group: balance_proxy
    sentence: "How many times last month this account was taken down to nothing."
    kind: window_agg
    agg: count
    source: row_unit
    where: is_zero_balance_after
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count of a row-local drain flag"
  - id: drained_balance_share_30d_bps
    group: balance_proxy
    sentence: "How often this account's transactions empty it rather than leave a float behind."
    kind: quotient_int
    numerator: drained_balance_count_30d
    denominator: txn_count_in_30d
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing counts"
  - id: since_last_drain_hours
    group: balance_proxy
    sentence: "How long it has been since this account was last emptied."
    kind: recency
    source: event_ts_utc
    where: is_zero_balance_after
    as_of: row_event_ts
    window: lifetime
    group_by: [entity]
    dtype: int64
    null_policy: null_without_prior_event
    leakage_sensitive: true
    leakage_note: "recency is measured strictly backwards from the scored row"

  # =======================================================================
  # exposure
  # =======================================================================
  # Plan §11 defines E_i, the money still interceptable AFTER the trigger. That is an
  # outcome and the quant layer owns it; it must never enter the matrix. What lives
  # here is the backward-looking extractability proxy, named so nobody confuses the
  # two, and the fold-scoped downstream measure.
  - id: extractable_share_24h_bps
    group: exposure
    sentence: "Of the money that arrived in the previous day, how much had already left again by this transaction."
    kind: quotient_int
    numerator: amount_out_24h_minor
    denominator: amount_in_24h_minor
    scale: 10_000
    as_of: row_event_ts
    window: 24h
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing one-day sums; the recovery window is read backwards"
  - id: extract_velocity_bps
    group: exposure
    sentence: "How much of this account's monthly outflow leaves in a single day rather than over weeks."
    kind: quotient_int
    numerator: amount_out_24h_minor
    denominator: amount_out_30d_minor
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of a one-day trailing sum to a thirty-day trailing sum"
  - id: downstream_outflow_24h_minor
    group: exposure
    sentence: "Money that left this account and the accounts it pays directly, inside the fold's network."
    kind: graph_node
    field: downstream_outflow_24h_minor
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "the fold's graph carried no downstream edge for this node, or none was supplied (DEV-011)"
    winsorise: true
    leakage_sensitive: true
    leakage_note: "fold-scoped: the graph behind it is rebuilt from that fold's edges only"

  # =======================================================================
  # graph local
  # =======================================================================
  # Supplied by P3a through a fold-sealed table and recomputed per fold. A null here is
  # a documented state, not a gap to fill: on PaySim the network is absent altogether
  # (DEV-011), and an imputed zero would assert the opposite of what was measured.
  - id: graph_in_degree_30d
    group: graph_local
    sentence: "How many distinct accounts paid this one inside the fold's network."
    kind: graph_node
    field: in_degree
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "star-shaped corpus: no inbound edge exists to count (DEV-011)"
    leakage_sensitive: true
    leakage_note: "fold-scoped degree; edges after the fold cutoff would encode the test period"
  - id: graph_out_degree_30d
    group: graph_local
    sentence: "How many distinct accounts this one paid inside the fold's network."
    kind: graph_node
    field: out_degree
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "external nodes never originate a payment, so out-degree is undefined rather than zero"
    leakage_sensitive: true
    leakage_note: "fold-scoped degree"
  - id: graph_effective_fan_in_30d
    group: graph_local
    sentence: "How many ordinary accounts funnelled money into this one, with payment gateways excluded."
    kind: graph_node
    field: fan_in_effective
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "rails carry null by design: their fan-in is a customer base, not a pattern (plan §7)"
    leakage_sensitive: true
    leakage_note: "fold-scoped, and the rail typing that makes it meaningful is itself fold-scoped"
  - id: graph_effective_fan_out_30d
    group: graph_local
    sentence: "How many ordinary accounts this one scattered money to, with payment gateways excluded."
    kind: graph_node
    field: fan_out_effective
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "external nodes originate nothing, and rails are excluded from fan scoring"
    leakage_sensitive: true
    leakage_note: "fold-scoped fan-out"
  - id: graph_local_density_30d_bps
    group: graph_local
    sentence: "How much this account's counterparties also trade with each other, as a share."
    kind: graph_node
    field: local_density_bps
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "density needs two counterparties; below that it is undefined, not zero"
    leakage_sensitive: true
    leakage_note: "fold-scoped neighbourhood statistic"
  - id: graph_self_transfer_count_30d
    group: graph_local
    sentence: "How many times this account moved money to itself, excluded from the network measures and kept visible here."
    kind: graph_node
    field: self_transfer_count
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "node absent from the fold's graph, which is not a count of zero"
    leakage_sensitive: true
    leakage_note: "fold-scoped count"

  # =======================================================================
  # graph global
  # =======================================================================
  - id: graph_pagerank
    group: graph_global
    sentence: "How central this account is in the fold's payment network."
    kind: graph_node
    field: pagerank
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: float64
    null_policy: null_when_unobserved
    null_reason: "PageRank is undefined for a node the fold's graph does not contain"
    leakage_sensitive: true
    leakage_note: "recomputed per fold from that fold's edges; a full-corpus PageRank is exactly the leak this guard exists to stop"
    declared_score_because: "centrality is a normalised float weight, not money"
  - id: graph_betweenness_approx
    group: graph_global
    sentence: "How often this account sits on the path money takes between other accounts."
    kind: graph_node
    field: betweenness_approx
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: float64
    null_policy: null_when_unobserved
    null_reason: "approximated over a fixed pivot sample; an account never reached has no value"
    leakage_sensitive: true
    leakage_note: "the pivot sample is drawn inside the fold, so no test-period shortest path can be counted"
    declared_score_because: "a normalised path count, not money"
  - id: graph_k_core_number
    group: graph_global
    sentence: "How deeply embedded this account is in a tightly connected group."
    kind: graph_node
    field: k_core_number
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "leaves are pruned by the core decomposition and report null rather than a false zero"
    leakage_sensitive: true
    leakage_note: "fold-scoped decomposition"
  - id: graph_community_size
    group: graph_global
    sentence: "How many accounts the detected group this one belongs to contains."
    kind: graph_node
    field: community_size
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "communities are skipped when the fold's graph is too thin to partition (DEV-011)"
    leakage_sensitive: true
    leakage_note: "fold-scoped Leiden run with the fixed seed and canonical id order"
  - id: graph_community_id
    group: graph_global
    sentence: "Which detected group this account belongs to, as a stable identifier."
    kind: graph_node
    field: community_id
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "no community was assigned to this node inside this fold"
    leakage_sensitive: true
    leakage_note: "remapped to a canonical order so the same account keeps the same label between runs"

  # =======================================================================
  # graph typology
  # =======================================================================
  - id: graph_cycle_participation_count
    group: graph_typology
    sentence: "How many circular money paths this account sits inside."
    kind: graph_node
    field: cycle_participation_count
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "the bounded cycle search returns nothing on a star-shaped corpus, which is a finding rather than a gap (DEV-011)"
    leakage_sensitive: true
    leakage_note: "cycles enumerated per fold from that fold's edges, time-respecting, reversals excluded"
  - id: graph_max_cycle_retention_bps
    group: graph_typology
    sentence: "The largest share of money that came back round a loop through this account."
    kind: graph_node
    field: max_cycle_retention_bps
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "no value-retaining loop existed inside this fold's edges"
    leakage_sensitive: true
    leakage_note: "fold-scoped; retention below the configured floor is not counted as a cycle at all"
  - id: graph_longest_chain_length
    group: graph_typology
    sentence: "How many hops the longest shrinking payment chain through this account reached."
    kind: graph_node
    field: longest_chain_length
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: int64
    null_policy: null_when_unobserved
    null_reason: "no time-respecting chain of the minimum length existed in this fold"
    leakage_sensitive: true
    leakage_note: "fold-scoped path search with bounded depth and a per-component budget"
  - id: graph_is_external
    group: graph_typology
    sentence: "Whether this account only ever appears as somebody else's counterparty."
    kind: graph_node
    field: is_external
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: bool
    null_policy: null_when_unobserved
    null_reason: "node absent from the fold's graph"
    leakage_sensitive: true
    leakage_note: "fold-scoped node typing"

  # =======================================================================
  # rule derived
  # =======================================================================
  # One severity per typology rule R1-R12 plus two roll-ups. Severities are P3b's
  # output, normalised to 0-1 by how far the observation exceeds threshold, and arrive
  # fold-sealed so a threshold fitted on the test window cannot ride in behind them.
  - id: rule_r1_pass_through_severity
    group: rule_derived
    sentence: "How strongly money received here was passed straight on again."
    kind: rule_field
    rule_id: R1
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: float64
    null_policy: null_when_no_rule_hit
    null_reason: "the rule did not fire inside this fold"
    leakage_sensitive: true
    leakage_note: "fold-scoped severity; rule thresholds are fitted on the training window only"
    declared_score_because: "severity is a dimensionless value in [0,1], not money"
  - id: rule_r2_fan_in_severity
    group: rule_derived
    sentence: "How strongly many small payments gathered into this account."
    kind: rule_field
    rule_id: R2
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: float64
    null_policy: null_when_no_rule_hit
    null_reason: "the rule did not fire inside this fold"
    leakage_sensitive: true
    leakage_note: "fold-scoped severity"
    declared_score_because: "severity is dimensionless"
  - id: rule_r3_fan_out_severity
    group: rule_derived
    sentence: "How strongly this account scattered incoming money out to many recipients."
    kind: rule_field
    rule_id: R3
    as_of: fold_scoped
    window: fold_scoped
    group_by: [entity]
    dtype: float64
    null_policy: null_when_no_rule_hit
    null_reason: "the rule did not fire inside this fold"
    leakage_sensitive: true
    leakage_note: "fold-scoped severity"
    declared_score_because: "severity is dimensionless"
  - id: rule_r4_cycle_severity
    group: rule_derived
