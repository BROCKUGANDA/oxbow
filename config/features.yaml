# OXBOW feature registry — the single declaration of what the feature layer computes.
#
# Plan §8 (P2): "Every feature in config/features.yaml declares an as-of timestamp and
# a lookback window. Rolling aggregates computed with Polars over sorted time, NEVER
# over the whole corpus."
#
# THIS FILE IS THE CODE. `oxbow.features.registry` loads it and `oxbow.features.kinds`
# dispatches on the declared `kind`; neither module contains a feature name. A feature
# that is not declared here does not exist, and an undeclared kind, a missing lookback
# or an empty sentence fails the load naming the feature. That inversion is deliberate:
# a registry nobody can read is a feature list nobody can audit.
#
# ENTRY FIELDS (required unless marked optional)
#   id                 column name in the feature matrix
#   group              one of the nine plan §8 taxonomy groups
#   sentence           ONE plain-English sentence. This string is the SHAP panel's
#                      dictionary entry and the scorecard's attribute label, so it is
#                      written for a reader who has never seen the code: no jargon, no
#                      filler, no "this feature measures…".
#   kind               which kernel computes it (see the kinds table below)
#   as_of              row_event_ts | fold_scoped — the cutoff rule
#   window             a duration, or lifetime | point_in_time | fold_scoped
#   group_by           the partition key: entity, plus currency for money and
#                      counterparty for pair-level counts
#   dtype              int64 | float64 | int32 | bool
#   null_policy        what a null means here, stated rather than left to inference
#   leakage_sensitive  true | false, with `leakage_note` justifying it either way
#   role               optional: feature (in the matrix, default) | intermediate
#                      (consumed by other entries, never published)
#   winsorise          optional: clip this column at the fitted percentile, features only
#   source / where / agg / quantile / subject / value / formula / numerator /
#   denominator / denominator_power / scale / a / b / field / rule_id / categories
#                      optional, read only by the kinds that name them
#
# MONEY (DEV-005, plan §8): every money column is int64 minor units and named
# `*_minor`. Money is never averaged, differenced or ratioed into a float: means and
# shares are exact integer quotients (`sum // count`, `num * 10_000 // den` in basis
# points). Where a float is the only sane answer — a robust z-score, a Benford
# deviation, a centrality, a rule severity — the column is named as a score, its dtype
# is float64, and its entry carries `declared_score_because`. Currency is part of the
# partition key for every money aggregate, so a cross-currency sum is structurally
# unavailable, and the build still fails loudly if one entity shows two currencies.
#
# TIME (03 C): ordering and windows read `event_ts_utc` only. Human-hours features read
# `local_hour` / `event_date_local` only. No entry reads both to answer one question:
# an ODD_HOUR signal computed from a UTC hour would flag an entire East African morning.
#
# AS-OF: the window is (cutoff − window, cutoff] with cutoff = the scored row's own
# event_ts_utc, so the row's own fields are in scope and nothing after it can be.
# Right-closed because the decision is taken at that instant with that instant already
# known; fold cutoffs use the same rule with the fold boundary as the anchor.

spec_version: 2
code_version: "p2.1"

# --- window semantics -----------------------------------------------------
window_semantics:
  as_of: row_event_ts
  interval: "(event_ts_utc - window, event_ts_utc]"
  fold_interval: "(fold_cutoff_ts - window, fold_cutoff_ts]"
  sort_order: [event_ts_utc, txn_id] # the codebase-wide total order (plan §7)
  sealed_windows: true
  late_arrival_counter: true
  # Windows overlap by the longest rule lookback so a pattern spanning a boundary is
  # visible in at least one window (plan §8); hits are deduplicated by pattern
  # signature, not by window. Both live in oxbow.backtest.splits, the one module
  # allowed to compute windows.
  overlap_hours: 168

# The longest rolling lookback in the registry. The split module asserts that this
# equals walk_forward.embargo_days in config/splits.yaml: an embargo shorter than the
# longest feature window would let a training row read test-period data.
max_lookback_days: 30

# --- taxonomy -------------------------------------------------------------
groups:
  - volume_value
  - counterparty
  - temporal
  - graph_local
  - graph_global
  - graph_typology
  - balance_proxy
  - exposure
  - rule_derived

# --- kinds ----------------------------------------------------------------
# The dispatch table. Every kind here has exactly one implementation in
# oxbow.features.kinds and the two are cross-checked at import: a registry entry
# naming a kind that is not declared here fails the load, and a declared kind with no
# implementation fails the import. Neither list may contain a feature name.
kinds:
  window_agg: "aggregate over (cutoff - window, cutoff] within group_by, honouring `where`"
  forward_window: "aggregate over [cutoff, cutoff + window): role 'outcome' only, never a matrix column"
  distinct_in_window: "count of key first-occurrences in the window; the subject must be a timestamp-ordered label"
  cumulative_distinct: "how many distinct subjects the partition has ever met, as of each row"
  first_seen_flag: "1 on the first row that ever pairs this group with this subject"
  quotient_int: "exact integer ratio of two declared features, scaled then floored"
  diff_int: "exact integer difference of two declared features"
  row_flag: "boolean predicate over the row's own canonical fields"
  row_value: "int64 value derived from the row's own canonical fields"
  event_field: "row field carried as a code from a declared, sorted category list"
  float_stat: "declared float score over a trailing window: robust z, burstiness, Benford"
  recency: "whole hours between the cutoff and the last row matching `where`"
  cumulative: "lifetime as-of quantity: everything in the group up to the cutoff"
  graph_node: "fold-sealed node attribute supplied by the P3a graph layer"
  rule_field: "fold-sealed rule severity supplied by the P3b rules layer"

# --- the registry ---------------------------------------------------------
features:
  # =======================================================================
  # volume / value
  # =======================================================================
  # Zero-amount rows are balance probes: kept, flagged, and excluded from value
  # features by the `*_nonzero` predicates those features name (plan §8, 03 D).
  - id: is_zero_value
    group: volume_value
    role: intermediate
    sentence: "Marks a transaction that moved no money at all, which is how a balance probe looks."
    kind: row_flag
    predicate: zero_amount
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: never_null
    leakage_sensitive: false
    leakage_note: "reads only the scored row's own amount, so there is no window to leak through"
  - id: txn_count_in_24h
    group: volume_value
    sentence: "How many transactions this account took part in during the previous day."
    kind: window_agg
    agg: count
    source: row_unit
    where: always
    as_of: row_event_ts
    window: 24h
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "a count over a trailing day is only honest if rows after the cutoff cannot enter it"
  - id: txn_count_in_30d
    group: volume_value
    sentence: "How many transactions this account took part in during the previous month."
    kind: window_agg
    agg: count
    source: row_unit
    where: always
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing thirty-day window; its length is what max_lookback_days and the embargo agree on"
  - id: zero_value_count_30d
    group: volume_value
    sentence: "How many times last month this account sent a transaction worth nothing to test the water."
    kind: window_agg
    agg: count
    source: row_unit
    where: is_zero_value
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count filtered on a row-local flag"
  - id: amount_in_24h_minor
    group: volume_value
    sentence: "Total money received in the previous day, in minor units."
    kind: window_agg
    agg: sum
    source: amount_minor
    where: is_inflow_nonzero
    as_of: row_event_ts
    window: 24h
    group_by: [entity, currency]
    dtype: int64
    null_policy: never_null
    winsorise: true
    leakage_sensitive: true
    leakage_note: "sums money over a trailing day; a future receipt would inflate it"
  - id: amount_in_30d_minor
    group: volume_value
    sentence: "Total money received in the previous month, in minor units."
    kind: window_agg
    agg: sum
    source: amount_minor
    where: is_inflow_nonzero
    as_of: row_event_ts
    window: 30d
    group_by: [entity, currency]
    dtype: int64
    null_policy: never_null
    winsorise: true
    leakage_sensitive: true
    leakage_note: "sums money over a trailing month"
  - id: amount_out_24h_minor
    group: volume_value
    sentence: "Total money sent in the previous day, in minor units."
    kind: window_agg
    agg: sum
    source: amount_minor
    where: is_outflow_nonzero
    as_of: row_event_ts
    window: 24h
    group_by: [entity, currency]
    dtype: int64
    null_policy: never_null
    winsorise: true
    leakage_sensitive: true
    leakage_note: "sums money out over a trailing day"
  - id: amount_out_30d_minor
    group: volume_value
    sentence: "Total money sent in the previous month, in minor units."
    kind: window_agg
    agg: sum
    source: amount_minor
    where: is_outflow_nonzero
    as_of: row_event_ts
    window: 30d
    group_by: [entity, currency]
    dtype: int64
    null_policy: never_null
    winsorise: true
    leakage_sensitive: true
    leakage_note: "sums money out over a trailing month"
  - id: inflow_count_30d
    group: volume_value
    sentence: "How many times money arrived in the previous month."
    kind: window_agg
    agg: count
    source: row_unit
    where: is_inflow
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count over a direction-filtered window"
  - id: net_flow_30d_minor
    group: volume_value
    sentence: "Money received minus money sent over the previous month, in minor units."
    kind: diff_int
    a: amount_in_30d_minor
    b: amount_out_30d_minor
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    winsorise: true
    leakage_sensitive: true
    leakage_note: "difference of two trailing thirty-day sums, both anchored at the scored row"
  - id: typical_movement_30d_minor
    group: volume_value
    sentence: "A middle-sized movement of the same kind as this one, in or out, over the previous month."
    kind: window_agg
    agg: median
    source: amount_minor
    where: always
    as_of: row_event_ts
    window: 30d
    group_by: [entity, direction]
    dtype: int64
    null_policy: null_when_window_empty
    leakage_sensitive: true
    leakage_note: "an order statistic over a trailing window; reading forward would move it"
  - id: largest_movement_30d_minor
    group: volume_value
    sentence: "The single largest movement of the same kind as this one last month, in minor units."
    kind: window_agg
    agg: max
    source: amount_minor
    where: always
    as_of: row_event_ts
    window: 30d
    group_by: [entity, direction]
    dtype: int64
    null_policy: null_when_window_empty
    winsorise: true
    leakage_sensitive: true
    leakage_note: "a maximum over a trailing window"
  - id: amount_in_mean_30d_minor
    group: volume_value
    sentence: "The average size of a receipt last month, in whole minor units."
    kind: quotient_int
    numerator: amount_in_30d_minor
    denominator: inflow_count_30d
    scale: 1
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    winsorise: true
    leakage_sensitive: true
    leakage_note: "quotient of two trailing aggregates, so it inherits their window"
  - id: balance_kept_share_30d_bps
    group: volume_value
    sentence: "Of everything received last month, how much stayed rather than being sent straight on."
    kind: quotient_int
    numerator: net_flow_30d_minor
    denominator: amount_in_30d_minor
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing aggregates; a pass-through mule sits near zero"
  - id: amount_robust_z_last
    group: volume_value
    sentence: "How out of the ordinary this amount is against the account's own recent history."
    kind: float_stat
    formula: robust_z
    source: amount_minor
    where: is_nonzero
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: float64
    null_policy: null_when_indeterminate
    leakage_sensitive: true
    leakage_note: "standardised against a trailing thirty-day baseline, never against a corpus mean fitted later"
    declared_score_because: "a standardised deviation is a score in minor-unit-free units; it is float by definition and never summed"
  - id: benford_deviation_30d
    group: volume_value
    sentence: "How far the leading digits of this account's recent amounts drift from the pattern natural spending follows."
    kind: float_stat
    formula: benford_dev
    source: amount_minor
    where: is_nonzero
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: float64
    null_policy: null_when_indeterminate
    leakage_sensitive: true
    leakage_note: "mean log-mantissa deviation over a trailing window of the account's own amounts"
    declared_score_because: "a deviation scaled to [0,1] against Benford's law; a statistic, not money"

  # =======================================================================
  # counterparty
  # =======================================================================
  # Distinct counts use the first-in-window identity: the number of distinct keys in a
  # window equals the number of rows in it whose previous occurrence of that key sits
  # before the window start. Exact, backward-only and vectorised, which a rolling
  # n_unique is not.
  - id: is_self_transfer
    group: counterparty
    role: intermediate
    sentence: "Marks a transaction where the sender and the receiver are the same account."
    kind: row_flag
    predicate: self_transfer
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: never_null
    leakage_sensitive: false
    leakage_note: "a property of the scored row's two account fields"
  - id: not_self_transfer
    group: counterparty
    role: intermediate
    sentence: "Marks a transaction with a real counterparty on the other end."
    kind: row_flag
    predicate: not_self_transfer
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: never_null
    leakage_sensitive: false
    leakage_note: "a property of the scored row"
  - id: is_reversal
    group: counterparty
    sentence: "Marks a transaction that reverses an earlier one, which is a refund and not a cycle back to the sender."
    kind: row_flag
    predicate: reversal_txn
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: bool
    null_policy: never_null
    leakage_sensitive: false
    leakage_note: "a property of the scored row's type and its linked predecessor"
  - id: reversal_linked_count_30d
    group: counterparty
    sentence: "How many reversals involving this account happened last month."
    kind: window_agg
    agg: count
    source: row_unit
    where: is_reversal
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count of a row-local flag"
  - id: lifetime_counterparties
    group: counterparty
    sentence: "How many different accounts this one has ever dealt with, up to this transaction."
    kind: cumulative_distinct
    subject: counterparty
    where: not_self_transfer
    as_of: row_event_ts
    window: lifetime
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "distinct count over a trailing window via the first-in-window identity"
  - id: lifetime_inflow_counterparties
    group: counterparty
    sentence: "How many different accounts have ever paid this one, up to this transaction."
    kind: cumulative_distinct
    subject: counterparty
    where: is_inflow_not_self
    as_of: row_event_ts
    window: lifetime
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "distinct senders over a trailing window"
  - id: lifetime_outflow_counterparties
    group: counterparty
    sentence: "How many different accounts this one has ever paid, up to this transaction."
    kind: cumulative_distinct
    subject: counterparty
    where: is_outflow_not_self
    as_of: row_event_ts
    window: lifetime
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "distinct recipients over a trailing window"
  - id: is_counterparty_first_ever
    group: counterparty
    role: intermediate
    sentence: "Counts the first time this account has ever been seen dealing with that counterparty."
    kind: first_seen_flag
    subject: counterparty
    where: not_self_transfer
    as_of: row_event_ts
    window: lifetime
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "'first ever' is a backward minimum over the pair's own history; a later duplicate cannot undo it"
  - id: counterparties_first_seen_30d
    group: counterparty
    sentence: "How many brand-new counterparties appeared during the previous month."
    kind: window_agg
    agg: sum
    source: is_counterparty_first_ever
    where: always
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "sum of a backward first-seen flag over a trailing window"
  - id: new_counterparty_share_of_network_bps
    group: counterparty
    sentence: "Of every account this one has ever met, how large a share first appeared last month."
    kind: quotient_int
    numerator: counterparties_first_seen_30d
    denominator: lifetime_counterparties
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing aggregates"
  - id: nonself_visit_count_30d
    group: counterparty
    role: intermediate
    sentence: "How many transactions last month involved a real counterparty rather than the account itself."
    kind: window_agg
    agg: count
    source: row_unit
    where: not_self_transfer
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count over a counterparty-filtered window"
  - id: repeat_visit_count_30d
    group: counterparty
    role: intermediate
    sentence: "How many of last month's transactions repeated an already-known counterparty."
    kind: diff_int
    a: nonself_visit_count_30d
    b: counterparties_first_seen_30d
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "difference of two trailing counts"
  - id: nonzero_inflow_count_30d
    group: volume_value
    role: intermediate
    sentence: "How many receipts of a real value arrived last month."
    kind: window_agg
    agg: count
    source: row_unit
    where: is_inflow_nonzero
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count over a filtered window"
  - id: repeat_visit_share_30d_bps
    group: counterparty
    sentence: "What share of last month's transactions went to someone this account already knew."
    kind: quotient_int
    numerator: repeat_visit_count_30d
    denominator: txn_count_in_30d
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing aggregates"
  - id: pair_visit_count_30d
    group: counterparty
    sentence: "How many times this account dealt with the counterparty on this transaction during the previous month."
    kind: window_agg
    agg: count
    source: row_unit
    where: not_self_transfer
    as_of: row_event_ts
    window: 30d
    group_by: [entity, counterparty]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing window partitioned by the account-counterparty pair"
  - id: largest_pair_visit_count_30d
    group: counterparty
    role: intermediate
    sentence: "How often this account repeated its single most-used counterparty last month."
    kind: window_agg
    agg: max
    source: pair_visit_count_30d
    where: always
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "maximum of a trailing per-pair count, itself trailing"
  - id: top_counterparty_share_30d_bps
    group: counterparty
    sentence: "How much of last month's activity went to the one counterparty it used most."
    kind: quotient_int
    numerator: largest_pair_visit_count_30d
    denominator: txn_count_in_30d
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing aggregates"
  - id: is_amount_first_ever
    group: counterparty
    role: intermediate
    sentence: "Counts the first time this account has ever used that exact amount."
    kind: first_seen_flag
    subject: amount_minor
    where: is_nonzero
    as_of: row_event_ts
    window: lifetime
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "a first-ever marker looks only at the account's own earlier rows"
  - id: amounts_first_seen_30d
    group: counterparty
    role: intermediate
    sentence: "How many never-before-used amounts appeared last month."
    kind: window_agg
    agg: sum
    source: is_amount_first_ever
    where: always
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "sum of a backward first-ever flag over a trailing window"
  - id: lifetime_distinct_amounts
    group: counterparty
    sentence: "How many different amounts this account has ever used, up to this transaction."
    kind: cumulative_distinct
    subject: amount_minor
    where: is_nonzero
    as_of: row_event_ts
    window: lifetime
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "distinct count over a trailing window"
  - id: amount_repeat_count_30d
    group: counterparty
    role: intermediate
    sentence: "How many of last month's receipts used an amount this account had used before."
    kind: diff_int
    a: nonzero_inflow_count_30d
    b: amounts_first_seen_30d
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "difference of two trailing counts"
  - id: amount_repetition_30d_bps
    group: counterparty
    sentence: "What share of last month's receipts repeated an amount this account had already used."
    kind: quotient_int
    numerator: amount_repeat_count_30d
    denominator: nonzero_inflow_count_30d
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of a trailing count to a trailing distinct count"

  # =======================================================================
  # temporal
  # =======================================================================
  # Hour and weekday features read local_hour / event_date_local. Gaps and windows read
  # event_ts_utc. The two never answer the same question (03 C).
  - id: gap_since_previous_event_s
    group: temporal
    role: intermediate
    sentence: "Working value: seconds between this transaction and the account's previous one."
    kind: row_value
    value: gap_since_previous_event_s
    as_of: row_event_ts
    window: point_in_time
    group_by: [entity]
    dtype: int64
    null_policy: null_without_prior_event
    leakage_sensitive: true
    leakage_note: "a previous event is by construction in the past; the kernel reads no further forward"
  - id: dormancy_days_before_now
    group: temporal
    sentence: "How many days this account was silent immediately before this transaction."
