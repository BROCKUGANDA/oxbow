    agg: count
    source: row_unit
    where: is_weekend_local_date
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: never_null
    leakage_sensitive: true
    leakage_note: "trailing count filtered on the local calendar date"
  - id: weekend_share_30d_bps
    group: temporal
    sentence: "What share of last month's transactions fell on a local weekend day."
    kind: quotient_int
    numerator: weekend_count_30d
    denominator: txn_count_in_30d
    scale: 10_000
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
