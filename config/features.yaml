    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_zero_denominator
    leakage_sensitive: true
    leakage_note: "ratio of two trailing aggregates"
  - id: is_overnight_hour
    group: temporal
    role: intermediate
    sentence: "Marks a transaction that happened in the deployment timezone's quiet hours."
