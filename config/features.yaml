# --- guards ---------------------------------------------------------------
guards:
  # label_is_fraud / label_is_flagged / label_typology NEVER enter the feature
  # matrix. The registry cannot name them as a source or a predicate (banned_sources
  # below), the builder asserts they are absent from the output columns, and no
  # feature may exceed this absolute correlation with the label on the dev slice
  # (plan §8, spec §7.2).
  max_abs_correlation_with_label: 0.98
  banned_sources:
    - label_is_fraud
    - label_is_flagged
    - label_typology
    - isFraud
    - isFlaggedFraud
    - typology
  # LightGBM tolerates NaN, the scorecard does not, and the two silently diverge if a
  # non-finite value reaches the matrix. Fail the run, naming the column (03 H).
  require_finite: true
  # Winsorise at a configured percentile FOR FEATURES ONLY, fitted on the training
  # slice only. Reported money is always raw and the winsorisation is stated
  # (03 D: test_winsorise_features_not_reports).
  winsorise:
    enabled: true
    lower_percentile: 0.01
    upper_percentile: 0.99
    applies_to: declared_features_only
    fit_scope: training_slice_only
  # A missing feature is an explicit missing bin with its own WOE, never a mean, and a
  # null renders as an em dash rather than a convincing zero (03 A rule 2).
  missing_value_policy: explicit_bin
  null_renders_as: "—"
  # Reversals are typed, linked, kept visible and excluded from cycle detection: read
  # as an ordinary transfer a reversal manufactures a cycle back to the originator.
  reversal_txn_types: [REVERSAL]
  reversal_excluded_from:
    - graph_cycle_participation_count
    - graph_max_cycle_retention_bps
    - graph_longest_chain_length
  # Zero-amount rows are balance probes: kept and flagged, excluded from value
  # features by the predicates those features declare.
  zero_amount_policy: keep_flag_exclude_from_value
  # Quiet hours are a deployment-timezone statement, not an inference from data.
  overnight_local_hours: [0, 1, 2, 3, 4, 5]
  # A feature may not be excluded from the matrix and still be computed silently:
  # intermediates are declared, hashed, and dropped at the boundary; outcomes are
  # forward-looking by definition and are for the quant layer, never the model.
  allowed_roles: [feature, intermediate, outcome]
  role_definitions:
    feature: "a model input; published in the matrix"
    intermediate: "a declared input to other entries; computed, hashed, dropped at the boundary"
    outcome: "reads rows after the cutoff (exposure E_i, plan §11); refused in the matrix"
