    agg: mean_int
    source: gap_since_previous_event_s
    where: has_prior_event
    as_of: row_event_ts
    window: 30d
    group_by: [entity]
    dtype: int64
    null_policy: null_when_window_empty
    leakage_sensitive: true
    leakage_note: "integer mean of backward gaps over a trailing window"
  - id: interarrival_burstiness_30d
    group: temporal
    sentence: "Whether this account's transactions arrive in bursts or on a steady rhythm."
